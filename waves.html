<!DOCTYPE html>

<meta charset="UTF-8">

<title>Animated Purple Waves</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #160052;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.animated-background {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    overflow: hidden;
    isolation: isolate;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            #3515a4 0%,
            #26058b 28%,
            #1c006b 58%,
            #110044 100%
        );
}


/* =========================================================
   SVG
========================================================= */

.background-svg {
    position: absolute;

    left: -3%;
    top: -3%;

    width: 106%;
    height: 106%;

    z-index: 1;
}


/* Por defecto mostramos móvil */

.desktop-background {
    display: none;
}

.mobile-background {
    display: block;
}


/* =========================================================
   MOVIMIENTO DE LAS ONDAS
========================================================= */

.wave {
    transform-box: fill-box;
    transform-origin: center;

    will-change: transform;
}

.wave-a {
    animation:
        waveA 16s ease-in-out infinite alternate;
}

.wave-b {
    animation:
        waveB 21s ease-in-out infinite alternate;
}

.wave-c {
    animation:
        waveC 25s ease-in-out infinite alternate;
}

.wave-d {
    animation:
        waveD 19s ease-in-out infinite alternate;
}


@keyframes waveA {

    0% {
        transform:
            translate3d(-1%, 0%, 0)
            rotate(-0.6deg)
            scale(1);
    }

    100% {
        transform:
            translate3d(2%, -1.5%, 0)
            rotate(1deg)
            scale(1.035);
    }
}


@keyframes waveB {

    0% {
        transform:
            translate3d(1%, -1%, 0)
            rotate(0.5deg)
            scale(1.01);
    }

    100% {
        transform:
            translate3d(-2%, 1.5%, 0)
            rotate(-1deg)
            scale(1.045);
    }
}


@keyframes waveC {

    0% {
        transform:
            translate3d(-1%, 1%, 0)
            rotate(-0.4deg);
    }

    100% {
        transform:
            translate3d(1.8%, -1%, 0)
            rotate(0.8deg);
    }
}


@keyframes waveD {

    0% {
        transform:
            translate3d(1%, 1%, 0)
            rotate(0.4deg);
    }

    100% {
        transform:
            translate3d(-1.6%, -1%, 0)
            rotate(-0.7deg)
            scale(1.03);
    }
}


/* =========================================================
   TEXTURA
========================================================= */

.noise {
    position: absolute;

    inset: -40%;

    width: 180%;
    height: 180%;

    z-index: 10;

    opacity: 0.11;

    pointer-events: none;

    mix-blend-mode: soft-light;

    animation:
        noiseMove 0.25s steps(2) infinite;
}


@keyframes noiseMove {

    0% {
        transform: translate(0, 0);
    }

    25% {
        transform: translate(1%, -1%);
    }

    50% {
        transform: translate(-1%, 1%);
    }

    75% {
        transform: translate(1%, 1%);
    }

    100% {
        transform: translate(-1%, -1%);
    }
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette {
    position: absolute;

    inset: 0;

    z-index: 8;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(10, 0, 45, .20),
            transparent 18%,
            transparent 75%,
            rgba(8, 0, 40, .25)
        );
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 768px) {

    .mobile-background {
        display: none;
    }

    .desktop-background {
        display: block;
    }
}


/* =========================================================
   REDUCIR MOVIMIENTO
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .wave,
    .noise {
        animation: none !important;
    }
}
</style>

<script>
/* =========================================================
   PARALLAX

   Es intencionalmente MUY sutil.
   No queremos destruir la composición del diseño.
========================================================= */

const background =
    document.getElementById("animatedBackground");


let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;



/* =========================================================
   DESKTOP / MOUSE
========================================================= */

window.addEventListener(
    "pointermove",
    (event) => {

        /*
         * Convertimos posición del cursor
         * a valores entre -1 y 1.
         */

        targetX =
            (
                event.clientX /
                window.innerWidth
                -
                0.5
            ) * 6;


        targetY =
            (
                event.clientY /
                window.innerHeight
                -
                0.5
            ) * 6;

    },
    {
        passive: true
    }
);



window.addEventListener(
    "pointerleave",
    () => {

        targetX = 0;
        targetY = 0;

    }
);



/* =========================================================
   INTERPOLACIÓN SUAVE
========================================================= */

function animateBackground() {

    currentX +=
        (targetX - currentX)
        * 0.035;


    currentY +=
        (targetY - currentY)
        * 0.035;


    background.style.transform =
        `
        translate3d(
            ${currentX}px,
            ${currentY}px,
            0
        )
        scale(1.012)
        `;


    requestAnimationFrame(
        animateBackground
    );
}



animateBackground();
</script>
